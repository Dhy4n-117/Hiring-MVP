<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Apply for an open position. Submit your resume and cover letter." />
    <title>Apply – HireFlow</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="navbar-brand">
                <span class="logo-icon">💼</span>
                HireFlow
            </a>
            <div class="navbar-links">
                <a href="/">← Back to Jobs</a>
            </div>
        </div>
    </nav>

    <!-- Apply Form -->
    <div class="form-container">
        <div class="form-card">
            <h2>Apply for <span id="jobTitle">this position</span></h2>
            <p class="subtitle" id="jobSubtitle">Fill in your details below</p>

            <div id="alertBox"></div>

            <form id="applyForm" enctype="multipart/form-data">
                <input type="hidden" id="jobId" name="jobId" />

                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name <span class="required">*</span></label>
                        <input type="text" id="name" name="name" placeholder="John Doe" required />
                    </div>
                    <div class="form-group">
                        <label>Email <span class="required">*</span></label>
                        <input type="email" id="email" name="email" placeholder="john@example.com" required />
                    </div>
                </div>

                <div class="form-group">
                    <label>Phone Number <span class="required">*</span></label>
                    <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" required />
                </div>

                <div class="form-group">
                    <label>Resume <span class="required">*</span> <small style="color: var(--text-muted);"> (PDF, DOC,
                            DOCX — max 5MB)</small></label>
                    <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required />
                </div>

                <div class="form-group">
                    <label>Cover Letter</label>
                    <textarea id="coverLetter" name="coverLetter"
                        placeholder="Tell us why you're interested in this role..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>LinkedIn Profile <small style="color: var(--text-muted);">(optional)</small></label>
                        <input type="url" id="linkedin" name="linkedin"
                            placeholder="https://linkedin.com/in/yourprofile" />
                    </div>
                    <div class="form-group">
                        <label>GitHub Profile <small style="color: var(--text-muted);">(optional)</small></label>
                        <input type="url" id="github" name="github" placeholder="https://github.com/yourusername" />
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn" style="width: 100%; margin-top: 0.5rem;">
                    Submit Application
                </button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer-simple">
        &copy; 2026 HireFlow. All rights reserved.
    </footer>

    <script src="/js/apply.js"></script>
</body>

</html>
