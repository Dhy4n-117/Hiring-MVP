<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse open positions and join our team. Filter by department and location.">
    <title>Careers – Open Positions</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="navbar-brand">HireFlow</a>
            <ul class="navbar-links">
                <li><a href="/">Jobs</a></li>
                <li><a href="/admin/login.html">HR Login</a></li>
            </ul>
        </div>
    </nav>

    <section class="hero">
        <div class="container">
            <h1>Join Our Team</h1>
            <p>Explore open positions and find the role that's right for you. Apply in minutes.</p>
        </div>
    </section>

    <main class="container">
        <div class="filters" id="filters">
            <div class="filter-group">
                <select id="filterDepartment">
                    <option value="">All Departments</option>
                </select>
            </div>
            <div class="filter-group">
                <select id="filterLocation">
                    <option value="">All Locations</option>
                </select>
            </div>
        </div>

        <div id="jobsContainer" class="jobs-grid">
            <div class="spinner"></div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 HireFlow. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/jobs.js"></script>
</body>

</html>
