<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Jobs – HireFlow Admin</title>
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">HireFlow</div>
            <ul class="sidebar-nav">
                <li><a href="dashboard.html"><span class="icon">📊</span> Dashboard</a></li>
                <li><a href="jobs.html" class="active"><span class="icon">💼</span> Jobs</a></li>
                <li><a href="interviews.html"><span class="icon">📅</span> Interviews</a></li>
            </ul>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">🚪 Sign Out</button>
            </div>
        </aside>

        <div class="main-content">
            <div class="page-header">
                <h1>Manage Jobs</h1>
                <button class="btn btn-primary" onclick="openCreateModal()">+ Create Job</button>
            </div>

            <div id="alertBox"></div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Department</th>
                            <th>Location</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="jobsTable">
                        <tr>
                            <td colspan="6">
                                <div class="spinner"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Create/Edit Job Modal -->
    <div class="modal-overlay" id="jobModal">
        <div class="modal">
            <h2 id="modalTitle">Create Job</h2>
            <input type="hidden" id="editJobId">
            <div class="form-group">
                <label>Job Title</label>
                <input type="text" id="jobTitleInput" placeholder="e.g. Frontend Developer">
            </div>
            <div class="form-group">
                <label>Department</label>
                <input type="text" id="jobDepartment" placeholder="e.g. Engineering">
            </div>
            <div class="form-group">
                <label>Location</label>
                <input type="text" id="jobLocation" placeholder="e.g. Remote">
            </div>
            <div class="form-group">
                <label>Employment Type</label>
                <select id="jobType">
                    <option value="Full-time">Full-time</option>
                    <option value="Part-time">Part-time</option>
                    <option value="Contract">Contract</option>
                    <option value="Internship">Internship</option>
                </select>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="jobDescription" placeholder="Describe the role and responsibilities..."></textarea>
            </div>
            <div class="form-group">
                <label>Requirements</label>
                <textarea id="jobRequirements" placeholder="List the skills and qualifications..."></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('jobModal')">Cancel</button>
                <button class="btn btn-primary" id="saveJobBtn" onclick="saveJob()">Save</button>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/jobs.js"></script>
</body>

</html>
