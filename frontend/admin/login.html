<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Login – HireFlow</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>
    <div class="login-page">
        <div class="login-card">
            <div class="logo-icon">💼</div>
            <h2>HireFlow</h2>
            <p class="subtitle">HR Admin Portal</p>

            <div id="alertBox"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="admin@company.com">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px;" id="loginBtn">
                    Sign In →
                </button>
            </form>

            <div class="login-footer" style="margin-top: 1.5rem; font-size: 0.78rem; color: var(--text-muted);">
                Powered by <span style="font-weight: 600;">HireFlow</span>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>

</html>
