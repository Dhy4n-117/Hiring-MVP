<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse open positions and join our team. Filter by department and location.">
    <title>Careers – Open Positions | HireFlow</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Ambient floating orbs -->
    <div class="ambient-orb"></div>
    <div class="ambient-orb"></div>
    <div class="ambient-orb"></div>

    <!-- Cursor glow -->
    <div class="cursor-glow" id="cursorGlow"></div>

    <!-- Particles -->
    <canvas id="particles-canvas"></canvas>

    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="/" class="navbar-brand">HireFlow</a>
            <ul class="navbar-links">
                <li><a href="/">Jobs</a></li>
                <li><a href="/admin/login.html">HR Login</a></li>
            </ul>
        </div>
    </nav>

    <section class="hero">
        <div class="container">
            <h1><span class="gradient-text" id="heroTitle"></span></h1>
            <p>Explore open positions and find the role that's right for you. Apply in minutes and start your journey
                with us.</p>
            <div class="hero-stats">
                <div class="stat">
                    <div class="stat-number" id="jobCount">0</div>
                    <div class="stat-label">Open Positions</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="deptCount">0</div>
                    <div class="stat-label">Departments</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="locCount">0</div>
                    <div class="stat-label">Locations</div>
                </div>
            </div>
        </div>
    </section>

    <main class="container">
        <div class="search-filters" id="filters">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search jobs by title or keyword...">
            </div>
            <div class="filter-group">
                <select id="filterDepartment">
                    <option value="">All Departments</option>
                </select>
            </div>
            <div class="filter-group">
                <select id="filterLocation">
                    <option value="">All Locations</option>
                </select>
            </div>
        </div>

        <div id="jobsContainer" class="jobs-grid">
            <div class="spinner"></div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <span class="footer-brand">HireFlow</span>
                <p>&copy; 2026 HireFlow. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <button class="scroll-top-btn" id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

    <script src="js/jobs.js"></script>
</body>

</html>
