<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Apply for this position at HireFlow.">
    <title>Apply – HireFlow</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="ambient-orb"></div>
    <div class="ambient-orb"></div>
    <div class="ambient-orb"></div>
    <div class="cursor-glow" id="cursorGlow"></div>
    <canvas id="particles-canvas"></canvas>

    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="/" class="navbar-brand">HireFlow</a>
            <ul class="navbar-links">
                <li><a href="/">Jobs</a></li>
                <li><a href="/admin/login.html">HR Login</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div class="form-container">
            <h2>Apply for this Position</h2>
            <p class="subtitle" id="jobTitle">Loading job details...</p>

            <div class="step-indicator">
                <div class="step active" id="step1">
                    <div class="step-dot">1</div>
                    <span class="step-label">Personal Info</span>
                </div>
                <div class="step-line" id="line1"></div>
                <div class="step" id="step2">
                    <div class="step-dot">2</div>
                    <span class="step-label">Documents</span>
                </div>
                <div class="step-line" id="line2"></div>
                <div class="step" id="step3">
                    <div class="step-dot">3</div>
                    <span class="step-label">Submit</span>
                </div>
            </div>

            <div id="alertBox"></div>

            <form id="applyForm">
                <input type="hidden" id="jobId" name="jobId">

                <div class="form-group">
                    <label>Full Name <span class="required">*</span></label>
                    <input type="text" id="name" name="name" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label>Email <span class="required">*</span></label>
                    <input type="email" id="email" name="email" required placeholder="john@example.com">
                </div>

                <div class="form-group">
                    <label>Phone <span class="required">*</span></label>
                    <input type="tel" id="phone" name="phone" required placeholder="+91 98765 43210">
                </div>

                <div class="form-group">
                    <label>Resume (PDF/DOC/DOCX) <span class="required">*</span></label>
                    <div class="file-upload-zone" id="dropZone">
                        <span class="upload-icon">📄</span>
                        <div class="upload-text">
                            Drag & drop your resume here or <strong>browse</strong>
                        </div>
                        <div class="file-name" id="fileName" style="display:none;"></div>
                    </div>
                    <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required
                        style="display:none;">
                </div>

                <div class="form-group">
                    <label>Cover Letter</label>
                    <textarea id="coverLetter" name="coverLetter"
                        placeholder="Tell us why you're a great fit for this role..."></textarea>
                </div>

                <div class="form-group">
                    <label>LinkedIn / GitHub (optional)</label>
                    <input type="text" id="portfolioLinks" name="portfolioLinks"
                        placeholder="https://linkedin.com/in/yourprofile">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;" id="submitBtn">
                    Submit Application →
                </button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <span class="footer-brand">HireFlow</span>
                <p>&copy; 2026 HireFlow. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/apply.js"></script>
</body>

</html>
