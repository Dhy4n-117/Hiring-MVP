<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="View job details and apply for this position." />
    <title>Job Details – HireFlow</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="navbar-brand">
                <span class="logo-icon">💼</span>
                HireFlow
            </a>
            <button class="hamburger" id="menuToggle" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
            <div class="navbar-links" id="navLinks">
                <a href="/">← Back to Jobs</a>
                <a href="/admin/login.html">HR Login</a>
            </div>
        </div>
    </nav>

    <!-- Job Detail -->
    <div class="job-detail">
        <div id="jobDetailContainer">
            <div class="loader">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer-simple">
        &copy; 2026 HireFlow. All rights reserved.
    </footer>

    <script src="/js/job-detail.js"></script>
    <script>
        const toggle = document.getElementById('menuToggle');
        const nav = document.querySelector('.navbar');
        if (toggle) {
            toggle.addEventListener('click', () => nav.classList.toggle('open'));
            document.querySelectorAll('.navbar-links a').forEach(a =>
                a.addEventListener('click', () => nav.classList.remove('open'))
            );
        }
    </script>
</body>

</html>
