<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interviews – HireFlow Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">HireFlow</div>
            <ul class="sidebar-nav">
                <li><a href="dashboard.html"><span class="icon">📊</span> Dashboard</a></li>
                <li><a href="jobs.html"><span class="icon">💼</span> Jobs</a></li>
                <li><a href="interviews.html" class="active"><span class="icon">📅</span> Interviews</a></li>
            </ul>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">🚪 Sign Out</button>
            </div>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <div class="main-content">
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">☰</button>
            <div class="page-header">
                <h1>Schedule Interviews</h1>
            </div>

            <div id="alertBox"></div>
            <div class="toast-container" id="toastContainer"></div>

            <!-- Schedule Form -->
            <div class="schedule-card">
                <h2>📅 Schedule New Interview</h2>
                <form id="scheduleForm">
                    <div class="form-group">
                        <label>Select Application</label>
                        <select id="applicationSelect" required>
                            <option value="">Loading applications...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Interview Date & Time</label>
                        <input type="datetime-local" id="scheduledDate" required>
                    </div>
                    <div class="form-group">
                        <label>Meeting Link (Zoom / Google Meet)</label>
                        <input type="url" id="meetingLink" required placeholder="https://zoom.us/j/...">
                    </div>
                    <div class="form-group">
                        <label>Notes (optional)</label>
                        <textarea id="interviewNotes" placeholder="Any additional details..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">📅 Schedule Interview</button>
                </form>
            </div>

            <!-- Upcoming Interviews -->
            <div class="upcoming-section">
                <h2>📋 Upcoming Interviews</h2>
                <div class="interview-timeline" id="interviewTimeline">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/interviews.js"></script>
    <script>
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', () => {
                sidebar.classList.toggle('open');
                overlay.classList.toggle('active');
            });
            overlay.addEventListener('click', () => {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
            });
        }
    </script>
</body>

</html>
